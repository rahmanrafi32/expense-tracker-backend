services:
  postgres:
    image: postgres:latest
    container_name: local-postgres
    environment:
      POSTGRES_PASSWORD: rafi325011
      POSTGRES_USER: rafi
      POSTGRES_DB: expense-track
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
    